x 0}.input{border:1px solid #d4dfeb;border-radius:10px;padding:11px 13px;background:white;color:#1d2939;min-width:0}.toolbar .input{flex:1}.case-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.case h3{font-size:17px;margin:10px 0 9px}.case p{font-size:13px;line-height:1.55;color:#596f87}.case{display:flex;flex-direction:column}.case .actions{margin-top:auto;padding-top:12px}.tag{display:inline-flex;padding:5px 9px;background:#edf4fc;color:#2665a1;border-radius:100px;font-size:11px;font-weight:750}.tag.warn{background:#fff2df;color:#9e630f}.tag.ok{background:#e9f8ef;color:#197448}.split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}.exam-nav{display:flex;gap:8px;margin:14px 0 24px}.circle{width:40px;height:40px;border-radius:10px;border:1px solid #d4dfeb;background:white;font-weight:800;color:#566b80}.circle.active{background:#225ea8;border-color:#225ea8;color:white}.circle.done{border-color:#6ea58f;background:#e9f8ef;color:#176640}.timer{font-weight:850;font-size:29px;letter-spacing:1px;font-variant-numeric:tabular-nums;color:#225ea8}.timer.urgent{color:#c12944}.text-response{min-height:270px;resize:vertical;width:100%;border:1px solid #cbd9e9;border-radius:10px;padding:15px;line-height:1.7;outline-color:#316ba6}.prompt{line-height:1.75;font-size:15px}.scenario-summary{font-size:15px;line-height:1.8}.scenario-table{border-collapse:collapse;width:100%;font-size:13px;margin:14px 0 20px}.scenario-table td{border-bottom:1px solid #e5ebf2;padding:10px 9px;vertical-align:top;line-height:1.6}.scenario-table td:first-child{width:29%;font-weight:750;color:#435b77;background:#f5f8fc}.scenario-section{margin-top:23px;padding-top:5px}.scenario-section h3{font-size:15px;color:#214e80;margin-bottom:8px}.question-outline{border-left:3px solid #c5d8ee;padding:10px 15px;margin:12px 0;background:#f8fbff;border-radius:0 9px 9px 0;line-height:1.7;font-size:13px}.question-outline b{color:#194a80}.question-outline p{margin:4px 0 0}.scenario-bullets{padding-left:22px;line-height:1.85}.exam-nav{flex-wrap:wrap}.rows{display:flex;align-items:center;justify-content:space-between;gap:12px}.item{padding:14px 0;border-bottom:1px solid #ecf0f5}.item:last-child{border:0}.learning{background:#f3f8ff;border-left:3px solid #4c8acb;padding:14px 16px;border-radius:8px;line-height:1.7}.score{font-size:48px;font-weight:850;color:#183e73}.grade-row{display:grid;grid-template-columns:180px 1fr 80px;align-items:center;gap:12px;margin:12px 0;font-size:13px}.meter{height:8px;background:#e7edf5;border-radius:10px;overflow:hidden}.bar{height:100%;background:#397db8;border-radius:10px}.feedback{background:#f4f7fb;padding:12px 15px;border-radius:9px;margin:10px 0;line-height:1.5}.feedback li{margin:7px 0}.label{display:block;font-size:12px;font-weight:800;margin:8px 0;color:#4c6380}.gap{height:12px}.notice{padding:12px 15px;background:#fff7e9;color:#7e5b21;border-radius:10px;font-size:12px;line-height:1.5}.details{border:1px solid #e3eaf3;border-radius:12px;margin-top:10px;background:white}.details summary{cursor:pointer;padding:14px;font-weight:750}.details .body{padding:0 15px 15px;line-height:1.7;font-size:13px}.hidden{display:none!important}.history-row{display:flex;gap:14px;align-items:center;justify-content:space-between;border-bottom:1px solid #e8edf5;padding:15px 0}.history-row:last-child{border:0}.footer{margin-top:40px;color:#98a7ba;font-size:12px}.sticky{position:sticky;top:22px}.progress{height:7px;background:#e5ecf5;border-radius:10px;overflow:hidden}.progress>div{height:100%;background:#3c83b9}.chapter{margin-bottom:18px}h2{font-size:20px;letter-spacing:-.5px;margin-top:0}h4{margin-bottom:6px}p{line-height:1.58}ol,ul{line-height:1.65;padding-left:24px}@media(max-width:1000px){.split{grid-template-columns:1fr}.sticky{position:static}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.sidebar{width:205px}}@media(max-width:680px){.app{display:block}.sidebar{height:auto;width:100%;position:relative;pad <script>const CASES=[{"id":1,"title":"SUBVENCIONA","category":"Categorización","difficulty":"Media","description":"La nueva plataforma de subvenciones, basada en React, FastAPI y PostgreSQL y alojada en una nube de la UE, gestiona DNI, cuentas bancarias, resoluciones y justificantes. Su puesta en producción está pendiente.","issue":"Solo hay usuario y contraseña para empleados; todos pueden modificar cualquier expediente; no hay análisis de riesgos, las copias nunca se han restaurado, faltan logs de cambios y pruebas de conformidad del proveedor.","questions":["Analiza la información y servicios de SUBVENCIONA. Propón y justifica los niveles de confidencialidad, integridad, trazabilidad, autenticidad y disponibilidad (C-I-T-A-D), valorando consecuencias para ciudadanía y Ayuntamiento. Determina la categoría ENS global y explica la regla que la sustenta. Si faltan datos, formula supuestos explícitos.","Identifica al menos cinco riesgos distintos para expedientes, datos bancarios, servicio web y componentes cloud. Para cada riesgo describe activo, amenaza, vulnerabilidad, probabilidad, impacto, salvaguardas existentes y riesgo residual. Explica cómo aplicarías una metodología como MAGERIT.","Diseña un plan de adecuación con al menos ocho medidas concretas del anexo II, identificando su familia org, op o mp y el riesgo que reduce. Atiende a permisos indiscriminados, MFA, auditoría de cambios, backups, actualizaciones y proveedor. Explica cómo prepararías la Declaración de Aplicabilidad.","Identifica los responsables de información, servicio, seguridad y sistema en la organización municipal. Describe qué requisitos decide cada rol, quién autoriza actuaciones y cómo se garantiza la separación de funciones entre seguridad y operación.","Propón las verificaciones previas a producción: evidencias de medidas implantadas, pruebas de seguridad, restauración, riesgo residual y garantías de proveedor. Explica qué evaluación de conformidad corresponde a la categoría que hayas determinado y cómo se gestionarían incumplimientos pendientes."],"criteria":[["confidencialidad|datos personales","integridad|alteracion","trazabilidad|registro","autenticidad|identidad","disponibilidad|plazo","categoria|impacto"],["activo|expedientes","amenaza|ransomware","vulnerabilidad|permisos","probabilidad|impacto","magerit|pilar","riesgo residual"],["politica|org","acceso|privilegio","mfa|multifactor","copias|restauracion","logs|registro","actualizacion|vulnerabilidades","cifrado|proteccion","aplicabilidad|anexo"],["responsable de informacion","responsable del servicio","responsable de seguridad","responsable del sistema","separacion|funciones"],["declaracion de aplicabilidad","auditoria|certificacion","evidencias|pruebas","riesgo residual|aceptacion","produccion|autorizacion"]],"weights":[2.5,2,3,1,1.5],"scenario":{"setting":"Ayuntamiento ficticio de 180.000 habitantes; nueva campaña de ayudas sociales y culturales con 12.000 solicitudes anuales.","baseline":"SUBVENCIONA se encuentra en preproducción; intervienen 45 tramitadores, 6 responsables de unidad y un proveedor de alojamiento externo.","facts":[["Aplicación","React + FastAPI + PostgreSQL en nube ubicada en la UE"],["Datos","DNI/NIE, domicilios, IBAN, documentos de renta, informes y resoluciones"],["Identidades","Ciudadanía por identificación electrónica; personal municipal con contraseña"],["Integraciones","Registro electrónico, portafirmas y sistema económico"],["Copias","Diarias a las 02:00; no se ha probado ninguna restauración"],["Categoría ENS","Todavía no formalizada"]],"trigger":"En la revisión previa se observa que cualquier empleado puede modificar todos los expedientes, no se registran los cambios, no existe análisis de riesgos y el proveedor no ha acreditado suficientes garantías ENS.","pressure":"La Concejalía exige publicar la plataforma antes del inicio del plazo de subvenciones, dentro de 20 días."}},{"id":2,"title":"Ransomware en el Ayuntamiento","category":"Incidentes","difficulty":"Alta","description":"Un ataque cifra los servidores de expedientes y archivos. La sede electrónica está caída; recaudación responde intermitentemente. Hay una cuenta administrativa posiblemente comprometida.","issue":"Las copias son diarias a las 02:00 y no se prueba su restauración desde hace 18 meses; hay conexiones sospechosas nocturnas y podría haber exfiltración.","questions":["Son las 08:15 y el cifrado sigue extendiéndose. Detalla, en orden temporal, qué harías durante los primeros 30 minutos desde la detección: contención, aislamiento de redes y servidores, gestión de credenciales, preservación de evidencias, continuidad mínima y comunicación al mando municipal. Razona qué servicios mantendrías si no parecen afectados.","Explica cómo activarías y gestionarías el incidente conforme al RD 311/2022. Describe el escalado interno, el papel de responsables de seguridad, servicio y sistema, la coordinación con CCN-CERT, el análisis de registros y la preservación de evidencias. Diferencia hechos confirmados de hipótesis.","Diseña la recuperación técnica y funcional de padrón, registro, tributación, expedientes y Policía Local. Indica cómo verificarías las copias conectadas, el entorno de restauración, las dependencias y el orden de puesta en servicio. Define RTO y RPO y cómo los usarías para establecer objetivos realistas.","Ante la posible extracción de datos del padrón, explica cómo determinarías si existe violación de datos personales y qué obligaciones pueden derivarse del RGPD y la LOPDGDD. Razona cuándo procede notificar a la autoridad competente, qué plazos y criterios se aplican y cuándo correspondería comunicarlo a las personas afectadas.","Propón al menos seis medidas técnicas u organizativas posteriores al incidente para reducir su probabilidad y su impacto. Incluye medidas sobre identidad, acceso privilegiado, segmentación, detección, copias y continuidad, vinculándolas, cuando sea posible, con familias o medidas del anexo II ENS.","El concejal propone pagar 15 BTC para agilizar la reapertura. Redacta una recomendación dirigida al alcalde, explicando los riesgos técnicos, jurídicos y operativos del pago, la incertidumbre sobre descifrado y exfiltración y las alternativas de gestión y recuperación disponibles."],"criteria":[["aislar|contencion","segmentacion|red","credenciales|revocar","evidencias|registros","prioridad|servicios","comunicacion|responsable"],["procedimiento|incidente","ccn|cert","responsable seguridad","escalado|coordinacion","preservar|evidencia","alcance|investigacion"],["bia|impacto","rto","rpo","restauracion|copias","entorno limpio|aislado","integridad|verificar"],["rgpd|brecha","aepd|autoridad","72 horas|plazo","alto riesgo|interesados","exfiltracion|padrón"],["mfa|multifactor","segmentacion|red","edr|deteccion","copias|inmutables","privilegio|minimo","monitorizacion|siem"],["no pagar|desaconsej","incertidumbre|garantia","descifrado|clave","riesgo|legal","recuperacion|alternativa"]],"weights":[2,2,2,1.5,1.5,1],"scenario":{"setting":"Villa Atlántica es un municipio ficticio de 120.000 habitantes con sede electrónica, padrón, registro, tributación, gestor de expedientes y Policía Local.","baseline":"Un lunes a las 08:15 ocho de los doce servidores muestran ficheros cifrados. Los atacantes afirman haber robado información y exigen 15 BTC antes de 72 horas.","facts":[["Padrón municipal","Inaccesible; posible exfiltración"],["Registro electrónico","Fuera de servicio"],["Gestor de expedientes","Ficheros cifrados"],["Policía Local","Gestión de incidencias parcialmente operativa"],["Portal tributario","No permite consultar ni pagar impuestos"],["Correo corporativo","Funciona; varias cuentas sospechosas"],["Active Directory","Posible compromiso de cuenta de administración"],["Backups","Última copia completa hace 48 h; repositorio conectado a la red"],["Firewall/EDR","Alertas críticas y tráfico a IP externas"],["ENS y continuidad","Categoría ALTA; plan sin ensayar desde hace 18 meses"]],"trigger":"A las 08:35 el alcalde solicita restablecer los servicios urgentemente. El concejal responsable propone pagar el rescate para evitar una paralización prolongada.","pressure":"Todavía no está confirmado si se han copiado datos personales del padrón. El equipo debe preservar pruebas y coordinar decisiones con el nivel directivo."}},{"id":3,"title":"Auditoría ENS de un organismo","category":"Auditoría","difficulty":"Media","description":"Una auditoría de un sistema ENS MEDIA descubre cuentas compartidas, permisos no revisados, logs incompletos y documentación obsoleta.","issue":"Además, se carece de pruebas de restauración y el proveedor de soporte no tiene condiciones contractuales suficientes.","questions":["Interpreta los hallazgos comunicados por el auditor: cuentas compartidas, permisos, trazabilidad, documentación y copias. Clasifica cada hallazgo según su gravedad relativa, señala qué requisito o medida ENS se ve comprometido y qué evidencia adicional solicitarías.","Identifica al menos cinco riesgos derivados de los hallazgos, relacionándolos con activos y servicios concretos. Explica cómo priorizarías su tratamiento mediante impacto, probabilidad, exposición y riesgo residual, teniendo en cuenta la categoría MEDIA.","Elabora un plan de acciones correctoras priorizado con medidas operativas precisas, responsables, plazo objetivo y evidencia de cierre para cada hallazgo. Incluye gestión de identidades, restauraciones, procedimientos de mantenimiento y condiciones del proveedor.","Indica qué responsables ENS y qué órganos municipales deben participar en la revisión, aceptación de riesgos residuales, seguimiento de desviaciones y validación de los controles. Explica cómo evitarías que el responsable de la operación validara de forma exclusiva su propio trabajo.","Explica el ciclo de auditoría, evaluación y certificación para un sistema MEDIA. Diferencia la corrección material de los hallazgos de su cierre documental y detalla los informes y pruebas que permitirían acreditar la conformidad."],"criteria":[["cuentas compartidas|identificacion","permisos|accesos","logs|trazabilidad","copias|restauracion","documentacion|politica"],["impacto|probabilidad","activo|amenaza","privilegio|suplantacion","continuidad|recuperacion","riesgo residual|prioridad"],["identidades|cuentas","revisiones|permisos","registro|logs","pruebas|copias","contrato|proveedor","plan|plazos"],["responsable seguridad","responsable sistema","responsable informacion","responsable servicio","seguimiento|responsables"],["auditoria|certificacion","no conformidad|hallazgo","evidencias|validacion","aplicabilidad|controles","cada dos anos|bienal"]],"weights":[2.5,2,3,1,1.5],"scenario":{"setting":"Un organismo autónomo municipal gestiona 65.000 expedientes al año y mantiene un sistema de categoría MEDIA certificado previamente.","baseline":"La evaluación periódica encuentra cuatro hallazgos mayores y dos observaciones. Se espera una propuesta correctora para la comisión de seguridad.","facts":[["Usuarios","110 cuentas; 8 son genéricas y compartidas"],["Permisos","Sin revisión desde hace 22 meses"],["Registros","Solo se conservan 20 días; no incluyen cambios relevantes"],["Copias","Restauración nunca probada en producción equivalente"],["Documentación","Declaración de Aplicabilidad y procedimientos obsoletos"],["Soporte","Proveedor accede en remoto sin anexo de seguridad actualizado"]],"trigger":"El informe auditor advierte que el sistema continúa operando y que la organización debe justificar el riesgo residual y aportar evidencias de las correcciones.","pressure":"El responsable de servicio solicita una priorización que reduzca el riesgo sin detener la tramitación ordinaria."}},{"id":4,"title":"SaaS de incidencias ciudadanas","category":"Cloud y proveedores","difficulty":"Alta","description":"El Ayuntamiento contratará un SaaS para comunicar incidencias, aportar fotografías con ubicación y hacer seguimiento. El proveedor aloja la aplicación en cloud.","issue":"El sistema integra directorio municipal, correo y herramientas de atención; se almacenan datos personales. El proveedor subcontrata infraestructura.","questions":["Delimita el alcance del SaaS, activos y flujos entre ciudadanía, Ayuntamiento y contratistas. Propón una categorización razonada por dimensiones C-I-T-A-D y distingue las responsabilidades del responsable público, el proveedor SaaS y sus subcontratistas.","Analiza riesgos asociados a datos personales, fotografías y geolocalización, acceso externo, APIs, indisponibilidad, dependencia tecnológica y subcontratación. Señala qué información necesitarías del proveedor para sustentar una decisión de seguridad.","Define una arquitectura de seguridad y un conjunto de requisitos exigibles en pliegos y contrato: autenticación, roles, cifrado, segregación, registros, gestión de incidentes, continuidad, reversibilidad de datos y supervisión de subcontratistas. Prioriza y justifica las medidas.","Determina los roles de información, servicio, seguridad y sistema, y organiza la autorización de accesos de operadores y empresas colaboradoras. Explica altas, bajas, revisión de privilegios y separación de funciones.","Establece cómo verificarías el cumplimiento ENS antes de adjudicación y durante el contrato: alcance de certificados y declaraciones, auditorías, evidencias, seguimiento de SLA, pruebas de seguridad, incidentes y finalización del servicio."],"criteria":[["informacion|datos","disponibilidad|servicio","integridad|incidencias","autenticidad|identificacion","categoria|impacto"],["proveedor|subcontratacion","filtracion|datos","integracion|api","dependencia|disponibilidad","riesgo|analisis"],["contrato|sla","mfa|autenticacion","cifrado|tls","logs|auditoria","segregacion|roles","copias|continuidad","vulnerabilidades|parches"],["responsable seguridad","responsable sistema","responsable servicio","responsable informacion","permisos|roles"],["certificacion|conformidad","declaracion aplicabilidad|medidas","auditoria|evaluacion","evidencias|informes","seguimiento|revisiones"]],"weights":[2.5,2,3,1,1.5],"scenario":{"setting":"Un municipio de 95.000 habitantes licita una plataforma SaaS para gestionar más de 30.000 incidencias ciudadanas anuales.","baseline":"La solución permite fotografías con geolocalización, avisos anónimos, seguimiento y acceso de empresas de mantenimiento.","facts":[["Alojamiento","Proveedor SaaS en nube con subencargados de infraestructura"],["Integraciones","APIs con directorio, correo y gestor municipal"],["Datos","Fotografías, ubicación, contacto y comentarios ciudadanos"],["Accesos","Ciudadanos, operadores municipales y contratistas externos"],["Disponibilidad","Necesaria para incidencias urgentes de vía pública"],["Contratación","Borrador de pliegos sin requisitos precisos de ENS ni salida de datos"]],"trigger":"La empresa asegura que cumple las mejores prácticas pero todavía no entrega el alcance de su certificado ENS ni pruebas de seguridad de integraciones.","pressure":"La mesa de contratación solicita requisitos verificables, responsabilidades claras y un plan de salida del proveedor."}},{"id":5,"title":"Caída del centro de datos","category":"Continuidad","difficulty":"Alta","description":"Una avería de alimentación y refrigeración deja fuera de servicio el centro de datos municipal. Los sistemas de padrón, registro y tributación quedan indisponibles.","issue":"Existe un segundo CPD con capacidad parcial, pero el plan de continuidad no se ensaya desde hace dos años.","questions":["Determina qué servicios y dependencias son críticos en la avería de CPD y cómo afectaría la indisponibilidad a la ciudadanía y a las funciones municipales. Valora las dimensiones ENS relevantes y explica cómo establecerías prioridades sin asumir que todos los sistemas tienen igual impacto.","Construye un análisis de riesgos del fallo eléctrico, refrigeración, pérdida del CPD y dependencias comunes. Describe causas, activos, amenazas, impacto, probabilidad, salvaguardas y riesgos que siguen existiendo en el centro alternativo.","Diseña el plan de continuidad y recuperación: BIA, objetivos RTO/RPO por servicio, utilización del segundo CPD limitado al 55%, restauración y validación de datos, comunicaciones y retorno al centro principal. Justifica el orden de recuperación.","Identifica qué responsables de seguridad, sistema, información y servicio autorizan las decisiones. Explica cómo coordinarías con proveedores, personal de emergencias y áreas funcionales, incluyendo mensajes para empleados y ciudadanía.","Propón simulacros, pruebas y evidencias para acreditar que el plan de recuperación funciona. Explica cómo documentarías incidencias, decisiones, lecciones aprendidas, revisiones de riesgos y validación de la vuelta a operación normal."],"criteria":[["disponibilidad","integridad","confidencialidad","impacto","categoria"],["alimentacion|electricidad","refrigeracion","dependencias","probabilidad|impacto","riesgo residual"],["bia|analisis de impacto","rto","rpo","cpd alternativo|segundo cpd","pruebas|restauracion","prioridad|servicios"],["responsable seguridad","responsable sistema","responsable servicio","comunicacion|ciudadania","coordinacion"],["simulacros|pruebas","evidencias|registros","auditoria","mejora|revision","autorizacion|vuelta"]],"weights":[2.5,2,3,1,1.5],"scenario":{"setting":"El CPD principal de un ayuntamiento da servicio al padrón, registro, tributación y administración electrónica.","baseline":"Una avería eléctrica seguida de pérdida de refrigeración obliga a apagar de emergencia varias máquinas virtuales.","facts":[["CPD principal","Sin climatización operativa; autonomía SAI 18 minutos"],["CPD alternativo","Capacidad aproximada del 55%; replica solo parte de los datos"],["Padrón","Indisponible"],["Registro","Indisponible, en jornada de vencimiento de plazos"],["Tributación","Indisponible"],["Copias","Copia completa de la noche anterior"],["Continuidad","Plan sin ejercicios reales en dos años"]],"trigger":"Los responsables funcionales discrepan sobre qué servicios deben recuperarse primero. El proveedor del CPD estima una reparación incierta.","pressure":"Se pide diferenciar continuidad provisional, recuperación completa y retorno controlado al centro principal."}},{"id":6,"title":"Fuga de datos del padrón","category":"Protección de datos","difficulty":"Alta","description":"Un empleado descarga un fichero con información del padrón y lo remite por error a un destinatario externo. Se desconoce si el archivo ha sido abierto o redistribuido.","issue":"El Ayuntamiento debe gestionar el evento sin interrumpir innecesariamente las consultas legítimas.","questions":["Evalúa qué dimensiones de seguridad se han visto afectadas por el envío externo y describe el posible perjuicio para los residentes. No confundas gravedad de la brecha con categoría global del sistema: justifica el alcance de cada conclusión.","Reconstruye el incidente desde los registros de correo y los testimonios. Identifica el activo, el error humano, las debilidades de controles, el número de registros afectados y las incertidumbres relevantes para valorar el riesgo para los interesados.","Ordena las medidas inmediatas para detener una posible difusión y preservar evidencia, y plantea controles ENS posteriores sobre acceso, clasificación de información, cifrado, registro y formación.","Define cómo deben colaborar responsable de seguridad, responsable de la información, responsable del sistema y delegado de protección de datos. Indica quién documenta los hechos, quién adopta decisiones y qué autorizaciones se requieren.","Determina qué análisis conduce a notificar a la autoridad de protección de datos, el plazo aplicable cuando proceda, y si deben ser informadas las personas afectadas. Explica cómo documentarías el cierre y las medidas correctoras."],"criteria":[["confidencialidad","datos personales","impacto","categoria","alcance"],["destinatario|envio","fichero|activo","error humano|vulnerabilidad","riesgo|interesados","exposicion|filtracion"],["revocar|solicitar borrado","registro|evidencias","cifrado","minimo privilegio","clasificacion|informacion","formacion"],["responsable seguridad","responsable informacion","responsable sistema","delegado proteccion datos|dpd","coordinacion"],["rgpd|brecha","aepd|autoridad","72 horas|plazo","documentar","medidas correctoras"]],"weights":[2.5,2,3,1,1.5],"scenario":{"setting":"El Servicio de Padrón municipal atiende diariamente a 400 personas y dispone de un repositorio documental.","baseline":"Un administrativo envía por error a una dirección externa una hoja de cálculo con 3.800 registros de habitantes.","facts":[["Información","Nombre, documento identificativo, domicilio, fecha de nacimiento"],["Envío","Correo saliente desde cuenta corporativa a tercero no autorizado"],["Cifrado","Archivo adjunto sin contraseña ni protección adicional"],["Confirmación","El destinatario no ha confirmado borrado ni apertura"],["Registros","Trazas de correo disponibles"],["Controles","No existe etiquetado automatizado ni DLP"]],"trigger":"La jefatura propone ignorar el caso porque no hay pruebas de uso indebido. El DPD solicita una evaluación formal.","pressure":"Debe decidirse si procede notificar a la autoridad de control y/o informar a personas afectadas, según el riesgo."}},{"id":7,"title":"Acceso privilegiado sin control","category":"Control de accesos","difficulty":"Media","description":"En una aplicación de recursos humanos, los administradores utilizan cuentas compartidas. No existen revisiones periódicas de permisos ni factor adicional de autenticación.","issue":"La aplicación contiene datos de nómina, permisos y expedientes internos.","questions":["Evalúa el efecto de las cuentas compartidas sobre confidencialidad, integridad, trazabilidad, autenticidad y disponibilidad de recursos humanos. Plantea una categorización basada en impactos, evitando darla por automática.","Identifica riesgos de suplantación, abuso privilegiado, modificación de nóminas, falta de atribución de acciones y conservación de accesos de exempleados o contratistas. Razona probabilidad e impacto.","Diseña un modelo de identidades y accesos que permita administración individual, MFA, permisos por rol, mínimo privilegio, gestión de altas/bajas, auditoría de operaciones y acceso de emergencia controlado.","Separa responsabilidades entre gestión de usuarios, aprobación de autorizaciones, administración técnica y auditoría. Indica qué roles ENS intervienen y cómo se resuelven conflictos de funciones.","Explica cómo probarías que los controles son eficaces y qué registros, informes y revisiones aportarías a la auditoría o evaluación de conformidad."],"criteria":[["confidencialidad","trazabilidad","integridad","autenticidad","categoria"],["cuentas compartidas","suplantacion","privilegio","riesgo","datos"],["mfa","cuentas individuales","rbac|roles","minimo privilegio","logs","revisiones","bajas|altas"],["responsable seguridad","responsable sistema","segregacion","auditoria","autorizacion"],["auditoria","evidencias","registros","prueba","revision"]],"weights":[2.5,2,3,1,1.5],"scenario":{"setting":"La aplicación de personal del ayuntamiento gestiona nóminas, ausencias y expedientes de empleados.","baseline":"Una revisión descubre que seis técnicos usan la misma cuenta administradora y que no hay evidencias de quién modificó una nómina.","facts":[["Usuarios","420 empleados y 6 administradores"],["Autenticación","Solo contraseña en cuentas privilegiadas"],["Privilegios","Perfil administrador permite leer y modificar toda la base de datos"],["Logs","No identifican a la persona que opera con cuenta compartida"],["Altas/bajas","Tres antiguos proveedores conservan acceso"],["Clasificación","Sin evaluación reciente de las dimensiones ENS"]],"trigger":"El Servicio de Recursos Humanos ha detectado una modificación de importe no autorizada, aunque no puede atribuirla a ningún operador.","pressure":"Se exige una solución compatible con tareas de mantenimiento y trazabilidad individual."}},{"id":8,"title":"Ataque DDoS a la sede electrónica","category":"Disponibilidad","difficulty":"Alta","description":"Durante el último día de presentación de ayudas, la sede electrónica recibe un ataque de denegación de servicio que la hace inaccesible.","issue":"La infraestructura es híbrida y depende de un proveedor de comunicaciones y un WAF externo.","questions":["Analiza los perjuicios de la indisponibilidad en un día de cierre de plazo. Determina qué dimensiones se ven afectadas, qué información adicional hace falta y qué nivel de seguridad propondrías para disponibilidad.","Describe cómo distinguirías un DDoS de un fallo de aplicación o base de datos mediante métricas, registros y coordinación con el proveedor. Identifica amenazas, puntos débiles y dependencias.","Diseña medidas de mitigación, escalado de capacidad, filtrado y continuidad, justificando qué acciones son inmediatas y cuáles requieren coordinación externa. Incluye el tratamiento de las solicitudes ciudadanas y la comunicación de la incidencia.","Define el procedimiento de escalado y qué deben decidir el responsable del servicio, el de seguridad y el del sistema, además del proveedor de conectividad y WAF.","Explica qué verificaciones realizarías tras restablecer el acceso, qué evidencias conservarías y cómo convertirías el incidente en cambios auditables de la arquitectura y de los planes de continuidad."],"criteria":[["disponibilidad","plazo","impacto","categoria","continuidad"],["ddos","trafico|peticiones","proveedor","monitorizacion","riesgo"],["waf|filtrado","mitigacion|scrubbing","capacidad|escalado","redundancia","comunicacion","registro"],["responsable servicio","responsable seguridad","responsable sistema","proveedor","escalado"],["evidencias","auditoria","simulacro","revision","medidas correctoras"]],"weights":[2.5,2,3,1,1.5],"scenario":{"setting":"La sede electrónica de Villa Atlántica recibe solicitudes de ayudas hasta las 23:59 de hoy.","baseline":"A las 18:10 el portal deja de responder tras pasar de 150 a 25.000 peticiones por segundo.","facts":[["Servicio","Sede electrónica y formulario de ayudas"],["Tráfico","Gran volumen procedente de múltiples orígenes"],["Proveedor","Conectividad externa y WAF contratado"],["Infraestructura","Balanceo híbrido; capacidad de ampliación limitada"],["Plazos","Vencimiento del trámite hoy"],["Evidencias","Métricas de red, WAF y balanceador disponibles"]],"trigger":"La concejalía pide comunicar la incidencia y buscar una alternativa legalmente válida para que la ciudadanía pueda realizar sus trámites.","pressure":"No está descartado un problema adicional en la base de datos; el equipo debe diferenciar causas."}},{"id":9,"title":"Migración a nube pública","category":"Cloud y proveedores","difficulty":"Alta","description":"Un ayuntamiento pretende trasladar correo, gestión documental y bases de datos a un entorno cloud con varias regiones.","issue":"La contratación está avanzada, pero no existe inventario consolidado de activos ni requisitos de salida del proveedor.","questions":["Inventaría los servicios y datos que se van a migrar, determina límites del sistema y propone cómo categorizarlo de acuerdo con las dimensiones ENS y los impactos de indisponibilidad o fuga.","Identifica riesgos de concentración de proveedor, ubicación y transferencias de datos, errores de configuración, identidades, pérdida de información, integración de redes y falta de reversibilidad. Priorízalos.","Propón un diseño seguro de migración por fases con controles de identidad, cifrado, segmentación, monitorización, copias, configuraciones y pruebas de retorno. Explica qué exigencias incorporarías al contrato cloud.","Asigna responsabilidades entre el Ayuntamiento, la oficina de proyectos, el proveedor cloud y los responsables ENS; indica qué decisiones no deben delegarse tácitamente.","Define la validación previa a cada oleada, evidencias de conformidad, alcance de auditorías, pruebas de restauración y un plan de seguimiento después de mover los datos."],"criteria":[["inventario|activos","informacion","servicios","categoria","impacto"],["dependencia|lock in","ubicacion|region","subcontratacion","configuracion","riesgo"],["cifrado","mfa","copias","segregacion","contrato|sla","salida|reversibilidad","monitorizacion"],["responsable seguridad","responsable sistema","responsable informacion","responsable servicio","proveedor"],["piloto|pruebas","auditoria|certificacion","conformidad","evidencias","migracion|retorno"]],"weights":[2.5,2,3,1,1.5],"scenario":{"setting":"Un ayuntamiento quiere migrar en seis meses correo, gestión documental y varias bases de datos a un proveedor de nube pública.","baseline":"Se prevé que trabajadores y contratistas accedan desde varias sedes y dispositivos.","facts":[["Servicios","Correo, gestión documental, bases de datos y copias"],["Datos","Expedientes municipales con datos personales"],["Cloud","Región UE; soporte del proveedor desde varios países"],["Identidad","Federación SSO prevista, MFA parcial"],["Dependencias","Directorio, VPN y enlaces intersedes"],["Contratos","No se ha negociado borrado reversible ni reversibilidad del servicio"]],"trigger":"La oficina de proyectos presenta un plan de migración centrado en costes sin análisis de riesgos ni inventario formal de activos.","pressure":"El tribunal solicita medidas antes, durante y después de la migración."}},{"id":10,"title":"Gestión de vulnerabilidades","category":"Vulnerabilidades","difficulty":"Media","description":"Un escaneo detecta bibliotecas críticas sin soporte, un servidor expuesto y una API sin controles suficientes. El sistema gestiona licencias de actividad.","issue":"No hay inventario de versiones ni ventanas de mantenimiento definidas.","questions":["Analiza la criticidad de la plataforma de citas y la repercusión de vulnerabilidades para las dimensiones ENS; explica qué información falta para categorizar los activos implicados.","Clasifica los hallazgos por explotabilidad y efecto sobre activos, diferenciando severidad técnica de riesgo efectivo. Describe una metodología de priorización reproducible.","Diseña un plan de remediación para librerías, servidor de administración expuesto y API sin control de tasa. Incluye parches, ventanas de mantenimiento, pruebas, hardening, monitorización y reversión.","Señala quién aprueba excepciones temporales, cambios de producción y aceptación del riesgo residual y cómo se garantiza una revisión independiente.","Explica cómo acreditarías cierre de hallazgos y efectividad: escaneo repetido, pruebas funcionales, registros de cambio, evidencias, seguimiento y auditoría ENS."],"criteria":[["integridad","disponibilidad","confidencialidad","categoria","impacto"],["exposicion","cvss|criticidad","probabilidad","activo","riesgo"],["inventario","parches|actualizacion","escaneo","pruebas|regresion","segmentacion","mitigacion","plazos"],["responsable seguridad","responsable sistema","desarrollo","autorizacion","cambio"],["registro|evidencias","verificacion","auditoria","revision","riesgo residual"]],"weights":[2.5,2,3,1,1.5],"scenario":{"setting":"En una revisión de seguridad de la plataforma de citas previas se detectan vulnerabilidades críticas.","baseline":"Un proveedor entrega un informe automático con 63 hallazgos, sin análisis de impacto ni pruebas de explotación autorizadas.","facts":[["Frontend","Dependencias JavaScript sin soporte"],["API","Expone rutas sin control de tasa"],["Servidor","Servicio de administración accesible desde Internet"],["Base de datos","Contiene citas y datos de contacto"],["Exposición","Servicio disponible para toda la ciudadanía"],["Gestión","No hay inventario SBOM ni calendario de parcheo"]],"trigger":"El desarrollador propone actualizar todas las dependencias sin pasar por pruebas porque el sistema funciona actualmente.","pressure":"La dirección pide priorización técnica, pruebas y plan de despliegue sin interrumpir la atención."}},{"id":11,"title":"Dispositivo extraviado","category":"Equipos y movilidad","difficulty":"Media","description":"Se pierde un portátil corporativo que permitía conexión remota a la red municipal. El equipo contiene documentos de inspección y credenciales de acceso guardadas.","issue":"El cifrado del disco no se ha verificado y no se sabe cuándo se conectó por última vez.","questions":["Valora las dimensiones ENS afectadas por el extravío y por la posible exposición de credenciales y listados. Explica qué información necesitas para determinar impacto y alcance.","Identifica amenazas derivadas del uso no autorizado del dispositivo, credenciales, VPN y sesiones, así como controles ausentes. Prioriza riesgos para servicios y datos.","Ordena las acciones de bloqueo, revocación, borrado remoto si procede, revisión de accesos, preservación de registros y sustitución segura del equipo. Justifica límites y verificaciones.","Explica responsabilidades de personal, seguridad, sistema e información y la posible intervención del DPD; define las comunicaciones internas y su documentación.","Establece qué evidencias permiten cerrar el incidente, cómo se valoran obligaciones por datos personales y qué controles preventivos de cifrado, MDM y formación deben reforzarse."],"criteria":[["confidencialidad","autenticidad","informacion","categoria","impacto"],["credenciales","revocacion|bloqueo","acceso remoto","filtracion","riesgo"],["cifrado disco","mfa","mdm|gestion dispositivos","borrado remoto","inventario","vpn|acceso","registro"],["responsable seguridad","responsable sistema","usuarios","dpd","comunicacion"],["evidencias","rgpd","evaluar notificacion","auditoria","formacion"]],"weights":[2.5,2,3,1,1.5],"scenario":{"setting":"Un técnico municipal pierde en transporte público su portátil de trabajo, usado para administrar servicios internos.","baseline":"El incidente se comunica seis horas después de la pérdida.","facts":[["Dispositivo","Portátil con cliente VPN y navegador corporativo"],["Disco","Se desconoce si está cifrado"],["Credenciales","Sesión de VPN y algunos tokens podrían seguir activos"],["Datos locales","Listados parciales de incidencias y datos de contacto"],["Gestión","MDM instalado, ubicación de última conexión disponible"],["Copia","Carpeta de trabajo sincronizada en servidor"]],"trigger":"El empleado afirma que el equipo tiene contraseña y que por tanto no existe riesgo.","pressure":"El área de informática debe valorar el riesgo real y decidir las medidas de protección y notificación."}},{"id":12,"title":"Phishing y fraude al proveedor","category":"Incidentes","difficulty":"Alta","description":"Un correo fraudulento induce a un empleado de contratación a cambiar la cuenta bancaria de un proveedor. Se detecta antes de efectuar el pago, pero el atacante podría haber accedido al correo.","issue":"La confirmación del cambio se realizó solo por email y no hay control de doble validación.","questions":["Valora el impacto posible sobre integridad, autenticidad, trazabilidad y disponibilidad del procedimiento de pagos y define la criticidad de la información involucrada.","Reconstruye el intento de fraude y explica cómo verificarías el origen del correo, la identidad del proveedor y el estado del cambio bancario. Identifica vulnerabilidades técnicas y de proceso.","Detalla cómo impedirías un pago fraudulento y protegerías evidencias: validaciones por canal independiente, doble autorización, filtrado, controles de correo y detección de cambios anómalos.","Asigna a contratación, intervención, tesorería, seguridad y sistemas sus decisiones y autorizaciones, evitando conflictos de funciones.","Define medidas correctoras y pruebas de efectividad, formación, registros, auditoría y procedimientos para futuras solicitudes de cambio de IBAN."],"criteria":[["integridad","autenticidad","confidencialidad","impacto","categoria"],["phishing","correo","cuenta","suplantacion","evidencias"],["bloquear|revocar","mfa","doble validacion","verificacion fuera de banda","logs","formacion"],["responsable seguridad","responsable sistema","intervencion","contratacion","comunicacion"],["auditoria","evidencias","seguimiento","formacion","procedimiento"]],"weights":[2.5,2,3,1,1.5],"scenario":{"setting":"El departamento de contratación gestiona cada mes cientos de facturas a proveedores.","baseline":"Un correo que aparenta proceder de una empresa adjudicataria solicita cambiar su IBAN para el próximo pago.","facts":[["Correo","Dominio parecido al del proveedor legítimo"],["Solicitud","Cambio de cuenta de 76.000 euros"],["Procedimiento","No existe segunda validación del IBAN"],["Situación","El cambio fue registrado pero el pago no se ha ejecutado"],["Registros","Correo y trazas del sistema contable disponibles"],["Formación","Sin campañas recientes frente a phishing"]],"trigger":"La responsable económica quiere saber si es un intento de fraude y cómo confirmar con garantías la instrucción recibida.","pressure":"Se pide combinar gestión de incidentes, segregación de funciones y controles de autorización."}},{"id":13,"title":"Aplicación municipal con APIs","category":"Desarrollo seguro","difficulty":"Alta","description":"Una aplicación de citas previas se integra con padrón y servicios de identificación mediante APIs. Una revisión revela tokens de larga duración y ausencia de limitación de peticiones.","issue":"Parte del código es desarrollado por un proveedor externo.","questions":["Determina los servicios, datos y confianza de cada integración, y valora cómo la suplantación o acceso cruzado afecta a las dimensiones de seguridad y a la categoría ENS.","Identifica riesgos de autorización por objeto, caducidad de tokens, exposición de información, abuso de API y ausencia de logs atribuibles. Explica cómo priorizarías las correcciones.","Diseña autenticación y autorización seguras, scopes, comprobación de propietario, segregación de secretos, cifrado de transporte, registro y protección de API. Propón pruebas negativas y controles en CI/CD.","Define cómo se distribuyen responsabilidades entre e o que depende de las copias y analiza las dimensiones ENS afectadas, especialmente disponibilidad e integridad, justificando impactos reales.","Analiza los riesgos de errores en retención, borrado accidental, ransomware sobre repositorios conectados y falta de copias aisladas. Estima escenarios de pérdida y riesgo residual.","Diseña una estrategia urgente y otra estructural de copias: aislamiento, inmutabilidad, retención, cifrado, verificaciones, recuperación granular, RTO/RPO y pruebas de restauración.","Aclara quién aprueba los objetivos de recuperación y acepta los riesgos, quién administra las copias y quién audita su eficacia. Incluye coordinación con proveedores.","Define plan de ensayos, informes, restauración de muestra y pruebas de desastre, además de evidencias necesarias para demostrar conformidad y mejora continua."],"criteria":[["disponibilidad","integridad","rpo","rto","categoria"],["error configuracion","borrado","activo","impacto","riesgo residual"],["copias inmutables|offline","3-2-1","restauracion|pruebas","retencion","cifrado","monitorizacion","segregacion"],["responsable seguridad","responsable sistema","responsable servicio","proveedor","aceptacion"],["pruebas","evidencias","auditoria","revision","mejora"]],"weights":[2.5,2,3,1,1.5],"scenario":{"setting":"Un ayuntamiento descubre que la consola de backup ha eliminado copias históricas por una política mal configurada.","baseline":"La única copia desconectada es de hace doce días y las bases de datos se modifican continuamente.","facts":[["Copias recientes","Repositorio online con eliminación de puntos históricos"],["Copias aisladas","Última copia offline hace 12 días"],["Servicios","Padrón, tributos, registro y recursos humanos"],["Pruebas","Restauración parcial hace un año"],["Monitorización","No se alertó de la eliminación masiva"],["Contratos","Almacenamiento remoto con retención insuficiente"]],"trigger":"El alcalde pregunta qué pasaría si se produce ransomware esta misma semana.","pressure sistema IoT y sus activos (sensores, gateways, redes, servicio de riego y datos). Explica el posible impacto en seguridad digital y servicio público y cómo valorarías las dimensiones ENS.","Identifica escenarios de explotación de credenciales por defecto, firmware antiguo, salto a red corporativa y manipulación de datos o actuadores. Prioriza riesgos por impacto y exposición.","Diseña segmentación de red, gestión de identidad por equipo, actualizaciones seguras, inventario, autenticación de gateways, monitorización y controles de proveedor. Justifica cada protección.","Define reparto de responsabilidades entre Medio Ambiente, informática, seguridad, servicio y proveedores de dispositivos o plataforma cloud, incluyendo autorizaciones de cambio.","Establece pruebas de seguridad en entornos IoT, monitorización, gestión de vulnerabilidades, revisiones de configuraciones, evidencias y evaluación periódica de riesgos."],"criteria":[["integridad","disponibilidad","autenticidad","categoria","datos"],["claves por defecto","red publica","movimiento lateral","firmware","riesgo"],["segmentacion","cifrado","credenciales unicas","actualizacion firmware","inventario","monitorizacion","acceso"],["responsable seguridad","responsable sistema","proveedor","mantenimiento","responsable servicio"],["pruebas","evidencias","auditoria","vulnerabilidades","revision"]],"weights":[2.5,2,3,1,1.5],"scenario":{"setting":"El área municipal de Medio Ambiente ha desplegado sensores de riego y calidad del aire en 70 emplazamientos.","baseline":"Un análisis descubre dispositivos con credenciales por defecto y firmware sin actualizaciones.","facts":[["Equipos","280 dispositivos IoT"],["Red","Algunos sensores alcanzan sistemas corporativos"],["Telemetría","Datos enviados a plataforma cloud de tercero"],["Actualizaciones","Firmware antiguo y sin inventario"],["Disponibilidad","La automatización controla programación de riego"],["Accesos","Mismo usuario técnico para mantenimiento en campo"]],"trigger":"Un de servicios sociales intercambia información con asociaciones colaboradoras.","baseline":"Una entidad externa detecta que puede consultar expedientes de otra organización mediante un cambio de identificador.","facts":[["Usuarios","Personal municipal y 24 entidades"],["Datos","Informes sociales y datos personales especialmente sensibles"],["Autorización","Roles sin aislamiento completo entre entidades"],["APIs","Consultas por ID sin validación consistente"],["Registros","Trazabilidad incompleta de consultas"],["Contrato","Acuerdos de acceso poco precisos"]],"trigger":"Se desconoce cuántos expedientes han podido consultarse indebidamente.","pressure":"Se debe contener la exposición, preservar la continuidad asistencial y definir un modelo robusto de autorización."}},{"id":20,"title":"Plan de adecuación ENS municipal","category":"Gobernanza","difficulty":"Media","description":"Un ayuntamiento mediano carece de inventario, categorización formal y responsables ENS claramente nombrados. Utiliza un ERP, sede electrónica, padrón y sistema de personal.","issue":"El presupuesto es limitado y la dirección solicita un plan viable a 12 meses.","questions":["Define cómo elaborarías el inventario y categorizarías los sistemas existentes según las cinco dimensiones ENS, estableciendo una priorización sustentada en el impacto real de los servicios.","Propón un procedimiento común de análisis de riesgos: activos, amenazas, vulnerabilidades, controles, probabilidad, impacto y riesgo residual. Explica cómo identificarías los sistemas más expuestos.","Diseña un plan por fases y recursos para implantar medidas org, op y mp en servicios prioritarios, incluyendo responsables, política de seguridad, proveedores, identidad, monitorización y continuidad.","Define el modelo de gobierno ENS del municipio: designaciones, separación de responsabilidades, comité de seguridad, autorización de medidas y seguimiento presupuestario.","Plantea la hoja de ruta de auditorías, declaración o certificación de conformidad por categoría, evidencias, plazos, revisiones y métricas para informar a Alcaldía."],"criteria":[["inventario","categoria","informacion","servicios","impacto"],["activos","amenazas","magerit|metodologia","probabilidad","riesgo"],["fases","priorizacion","medidas org","medidas op","medidas mp","aplicabilidad","presupuesto"],["politica seguridad","responsable informacion","responsable servicio","responsable seguridad","responsable sistema"],["auditoria","conformidad","declaracion aplicabilidad","indicadores|metricas","revision"]],"weights":[2.5,2,3,1,1.5],"scenario":{"setting":"Un ayuntamiento de 45.000 habitantes quiere adecuar toda su administración digital al ENS en los próximos nueve meses.","baseline":"La organización dispone de presupuesto limitado y más de 40 aplicaciones, algunas gestionadas por proveedores históricos.","facts":[["Inventario","Incompleto y no actualizado"],["Categorización","No formalizada"],["Responsables","No están designados todos los roles ENS"],["Riesgos","Sin metodología común"],["Política","Documento antiguo sin revisión"],["Proveedores","No se conoce el alcance de conformidad ENS de varios contratos"]],"trigger":"La Alcaldía solicita un programa realista, por fases, con costes, responsables, prioridades y evidencias verificables.","pressure":"La propuesta debe permitir abordar los servicios críticos primero, sin presentar la certificación como una simple compra documental."}}];const KEY='ens_academia_v1';const WEIGHTS=[2.5,2,3,1,1.5];const TITLES=['Análisis y diagnóstico','Riesgos y gestión','Actuaciones y medidas','Responsabilidades y coordinación','Verificación y mejora','Decisión final'];
const EDUCATION=[{title:'Categorización y dimensiones',text:'En el ENS se valoran confidencialidad, integridad, trazabilidad, autenticidad y disponibilidad. La categoría global del sistema se corresponde con el nivel más alto de cualquiera de esas dimensiones. Cada nivel debe estar justificado por el impacto.'},{title:'Riesgos · MAGERIT y PILAR',text:'Relaciona activos, amenazas, vulnerabilidades, impacto y probabilidad. Define salvaguardas y riesgo residual. MAGERIT es una metodología; PILAR, una herramienta de apoyo. Un riesgo no es simplemente una vulnerabilidad.'},{title:'Anexo II · Familias de medidas',text:'Las medidas se organizan en marco organizativo (org), operacional (op) y medidas de protección (mp). Deben seleccionarse según categoría y niveles por dimensión, documentándose en la Declaración de Aplicabilidad.'},{title:'Roles y responsabilidades',text:'Distingue al responsable de la información, del servicio, de la seguridad y del sistema. Separa decisión y supervisión de seguridad de la operación cotidiana. El Delegado de Protección de Datos tiene funciones distintas.'},{title:'Auditoría y conformidad',text:'Los sistemas de categoría BÁSICA requieren ordinariamente autoevaluación y declaración de conformidad; MEDIA y ALTA, auditoría formal y certificación. Las auditorías ordinarias son al menos bienales, y también puede requerirse auditoría extraordinaria.'},{title:'Incidentes y ransomware',text:'Estructura: preparación; detección y análisis; contención; erradicación; recuperación; lecciones aprendidas. Preserva evidencias y coordina la evaluación de notificaciones al CCN y, si procede por datos personales, a la autoridad competente.'},{title:'Continuidad · BIA, RTO y RPO',text:'El BIA identifica consecuencias y prioridades. RTO es el tiempo objetivo para recuperar el servicio. RPO cuantifica la pérdida de datos tolerable en tiempo. Los valores deben fijarse en función de las necesidades, no asumirse.'}];

function load(){try{return JSON.parse(localStorage.getItem(KEY))||{attempts:[],drafts:{}}}catch(e){return {attempts:[],drafts:{}}}}function save(){localStorage.setItem(KEY,JSON.stringify(store))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function norm(s){return String(s??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}function active(){return store.drafts[selected]||null}function getCase(id){return CASES.find(x=>x.id===Number(id))}function timefmt(s){return `${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}function remaining(d){return d.started?Math.max(0,5400-Math.floor((Date.now()-d.started)/1000)):5400}function historyFor(id){return store.attempts.filter(x=>x.caseId===id)}function nav(v){view=v;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
function header(k,title,sub){return `<div class="header"><div><div class="eyebrow">${esc(k)}</div><h1 class="heading">${esc(title)}</h1><div class="muted small">${esc(sub)}</div></div></div>`}
function home(){let done=new Set(store.attempts.map(a=>a.caseId)),avg=store.attempts.length?(store.attempts.reduce((a,b)=>a+b.score,0)/store.attempts.length).toFixed(1):'—';return header('Panel de estudio','Prepara el ENS como un A1','Simulacros de 90 minutos, seguimiento y ayudas para aprender.')+`<div class="grid"><div class="card stat"><div class="value">${CASES.length}</div><div class="label">Casos disponibles</div></div><div class="card stat"><div class="value">${done.size}</div><div class="label">Supuestos distintos resueltos</div></div><div class="card stat"><div class="value">${avg}</div><div class="label">Nota media orientativa</div></div></div><div class="gap"></div><div class="card"><h2>Tu siguiente simulacro</h2><p>Elige uno de los 20 casos detallados, redacta tus respuestas y recibe una evaluación local según una rúbrica temática. El reloj de 90 minutos comienza <b>solo cuando escribas por primera vez en la pregunta 1</b>.</p><button class="btn" onclick="nav('cases')">Ver 20 supuestos →</button></div><div class="gap"></div><div class="grid"><div class="card"><h2>Modalidad examen</h2><p>Enunciados detallados, preguntas ponderadas, cronómetro real y entrega al agotar los 90 minutos.</p></div><div class="card"><h2>Modalidad formación</h2><p>Conceptos, ayudas progresivas, criterios que se esperan y pistas del caso, sin revelar respuestas en el examen.</p></div><div class="card"><h2>Corrección ampliada</h2><p>Exporta todas tus respuestas en un texto estructurado para pedir a ChatGPT una revisión semántica y normativa más profunda.</p></div></div>`}
function casesView(){let cats=['all',...new Set(CASES.map(x=>x.category))],list=CASES.filter(c=>(caseFilter==='all'||c.category===caseFilter)&&norm(c.title+' '+c.description).includes(norm(search)));return header('Biblioteca de casos','20 supuestos prácticos','Todos se pueden repetir tantas veces como quieras.')+`<div class="toolbar"><button class="btn" onclick="toggleBuilder()">+ Nuevo supuesto</button><input id="search" class="input" placeholder="Buscar supuesto..." value="${esc(search)}" oninput="setSearch(this.value)"><select class="input" onchange="setFilter(this.value)">${cats.map(c=>`<option value="${esc(c)}" ${c===caseFilter?'selected':''}>${c==='all'?'Todas las materias':esc(c)}</option>`).join('')}</select></div><div id="builder" class="card hidden"><h2>Crear un supuesto personalizado</h2><p class="small muted">Añade tantos casos como quieras. Define un enunciado, una situación y cinco preguntas. La evaluación usa una rúbrica configurable por palabras clave, con carácter orientativo.</p><label class="label">Título</label><input class="input" id="newtitle" style="width:100%" placeholder="Ej.: Ataque a sistema de padrón"><label class="label">Enunciado</label><textarea class="text-response" id="newdesc" style="min-height:95px" placeholder="Contexto, infraestructura, servicios y objetivo"></textarea><label class="label">Incidente o deficiencias</label><textarea class="text-response" id="newissue" style="min-height:85px"></textarea><label class="label">Cinco preguntas, una por línea</label><textarea class="text-response" id="newquestions" style="min-height:130px" placeholder="Pregunta 1\nPregunta 2\nPregunta 3\nPregunta 4\nPregunta 5"></textarea><label class="label">Opcional: conceptos esperados por pregunta (una línea por pregunta, conceptos separados por comas)</label><textarea class="text-response" id="newcriteria" style="min-height:100px" placeholder="confidencialidad, integridad, categoría\nactivo, amenaza, impacto"></textarea><div style="margin-top:10px"><button class="btn" onclick="addCustom()">Guardar y empezar</button></div></div><div class="case-grid">${list.map(c=>`<div class="card case"><div class="rows"><span class="tag">Caso ${c.id} · ${esc(c.category)}</span><span class="tag ${c.difficulty==='Alta'?'warn':''}">${esc(c.difficulty)}</span></div><h3>${esc(c.title)}</h3><p>${esc(c.description)}</p><div class="actions rows"><span class="muted small">${historyFor(c.id).length} intentos</span><button class="btn small" onclick="openCase(${c.id})">${activeFor(c.id)?'Continuar':'Comenzar'} →</button></div></div>`).join('')}</div>${list.length?'':'<p>No se encontraron casos.</p>'}`}
function toggleBuilder(){document.getElementById('builder').classList.toggle('hidden')}function addCustom(){let title=document.getElementById('newtitle').value.trim(),desc=document.getElementById('newdesc').value.trim(),issue=document.getElementById('newissue').value.trim(),qs=document.getElementById('newquestions').value.split('\n').map(x=>x.trim()).filter(Boolean),raw=document.getElementById('newcriteria').value.split('\n');if(!title||!desc||qs.length!==5){alert('Introduce título, enunciado y exactamente cinco preguntas (una por línea).');return}let base=CASES[0].criteria;let criteria=qs.map((q,i)=>raw[i]?.trim()?raw[i].split(',').map(x=>x.trim()).filter(Boolean):base[i]);let id=Math.max(...CASES.map(x=>x.id))+1;let c={id,title,description:desc,issue,category:'Personalizado',difficulty:'Media',questions:qs,criteria,weights:WEIGHTS};CASES.push(c);store.custom.push(c);save();openCase(id)}function activeFor(id){return store.drafts[id]&&!store.drafts[id].submitted}
function openCase(id){selected=id;question=0;showHelp=false;if(!store.drafts[id]||store.drafts[id].submitted){store.drafts[id]={answers:Array(getCase(id).questions.length).fill(''),started:null,submitted:false,helpUsed:false};save()}if(store.drafts[id].answers.length!==getCase(id).questions.length){store.drafts[id].answers=Array.from({length:getCase(id).questions.length},(_,i)=>store.drafts[id].answers[i]||'');save()}view='exam';render()}
function setSearch(v){search=v;const p=document.getElementById('search')?.selectionStart;render();let e=document.getElementById('search');if(e){e.focus();e.setSelectionRange(p,p)}}function setFilter(v){caseFilter=v;render()}
function checkExpired(){let d=active();if(view==='exam'&&d?.started&&!d.submitted&&remaining(d)===0){submit(true);return true}return false}
function scenarioView(c){let sc=c.scenario;if(!sc){return `<p class="scenario-summary">${esc(c.description)}</p><h3>Situación técnica</h3><p>${esc(c.issue)}</p>`}return `<div class="scenario-section"><h3>1. Situación inicial</h3><p class="scenario-summary">${esc(sc.setting)}</p><p class="scenario-summary">${esc(sc.baseline)}</p></div><div class="scenario-section"><h3>2. Información técnica disponible</h3><table class="scenario-table"><tbody>${sc.facts.map(pair=>`<tr><td>${esc(pair[0])}</td><td>${esc(pair[1])}</td></tr>`).join('')}</tbody></table></div><div class="scenario-section"><h3>3. Incidencia o problema detectado</h3><p class="scenario-summary">${esc(sc.trigger)}</p><p class="scenario-summary">${esc(sc.pressure)}</p></div>`}
function examView(){let c=getCase(selected),d=active();if(!d)return '';let weights=c.weights||WEIGHTS;let seconds=remaining(d),status=d.started?'Tiempo restante':'El reloj empieza al escribir en la pregunta 1';return header('Examen en curso',`Caso ${c.id} · ${c.title}`,`Simulacro A1 · ${c.questions.length} apartados · 10 puntos · 90 minutos`)+`<div class="split"><div><div class="card"><div class="rows"><span class="tag">${esc(c.category)}</span><span class="tag ${c.difficulty==='Alta'?'warn':''}">Dificultad ${c.difficulty}</span></div><h2 style="margin-top:16px">Enunciado completo del supuesto</h2>${scenarioView(c)}<div class="scenario-section"><h3>4. Preguntas del tribunal — 10 puntos</h3><p class="small muted">Desarrolla decisiones, justifica su orden y fundamenta técnicamente tus propuestas. No se muestran respuestas modelo durante el examen.</p>${c.questions.map((q,i)=>`<div class="question-outline"><b>${i+1}. ${esc(TITLES[i]||'Decisión técnica')} · ${weights[i]} puntos</b><p>${esc(q)}</p></div>`).join('')}</div><div class="notice">Supuesto ficticio con fines de entrenamiento. Justifica las hipótesis que no estén especificadas. La puntuación automática local es orientativa; no sustituye una evaluación jurídica y técnica de tribunal.</div></div><div class="gap"></div><div class="card"><div class="rows"><h2>Tu respuesta</h2><span class="tag">${weights[question]} puntos</span></div><div class="exam-nav">${c.questions.map((q,i)=>`<button class="circle ${i===question?'active':''} ${d.answers[i].trim()?'done':''}" onclick="goQuestion(${i})">${i+1}</button>`).join('')}</div><div class="eyebrow">Pregunta ${question+1} de ${c.questions.length}</div><p class="prompt"><b>${esc(c.questions[question])}</b></p><textarea id="answer" class="text-response" placeholder="Desarrolla tu razonamiento. Incluye decisiones, justificación y aplicación al caso..." oninput="answerInput(this.value)">${esc(d.answers[question])}</textarea><div class="rows" style="margin-top:12px"><span class="muted small" id="words">${wordCount(d.answers[question])} palabras</span><div style="display:flex;gap:8px"><button class="btn secondary small" ${question===0?'disabled':''} onclick="goQuestion(${question-1})">Anterior</button><button class="btn secondary small" ${question===c.questions.length-1?'disabled':''} onclick="goQuestion(${question+1})">Siguiente</button></div></div></div></div><div class="sticky"><div class="card"><div class="muted small">${esc(status)}</div><div class="timer ${seconds<=600&&d.started?'urgent':''}" id="timer">${d.started?timefmt(seconds):'01:30:00'}</div><div class="progress"><div style="width:${100*(5400-seconds)/5400}%" id="timeprogress"></div></div><p class="small muted">${d.answers.filter(a=>a.trim()).length} de ${c.questions.length} preguntas con respuesta. El tiempo no se detiene al cambiar de pestaña ni cerrar el navegador.</p><button class="btn" style="width:100%;margin-bottom:8px" onclick="submit(false)">Entregar y evaluar</button><button class="btn secondary" style="width:100%;margin-bottom:8px" onclick="showHelpPanel()">${showHelp?'Ocultar':'Solicitar'} ayuda formativa</button><button class="btn ghost small" style="width:100%" onclick="abandon()">Descartar este intento</button>${showHelp?helpPanel(c,d):''}</div></div></div>`}
function wordCount(s){return s.trim()?s.trim().split(/\s+/).length:0}function answerInput(v){let d=active();if(!d||d.submitted)return;d.answers[question]=v;if(question===0&&!d.started&&v.trim()){d.started=Date.now();}save();let w=document.getElementById('words');if(w)w.textContent=wordCount(v)+' palabras';if(d.started){let t=document.getElementById('timer');if(t)t.textContent=timefmt(remaining(d))}}
function goQuestion(i){if(i<0||i>=getCase(selected).questions.length)return;question=i;render();}function showHelpPanel(){showHelp=!showHelp;if(showHelp){let d=active();d.helpUsed=true;save()}render()}
function helpPanel(c,d){let q=c.criteria[question];return `<div class="gap"></div><div class="learning"><b>Ayuda de formación</b><p class="small">Estructura tu respuesta en hechos del caso, decisión, justificación y evidencia. Puedes revisar los conceptos siguientes; usar ayuda quedará marcado en este intento.</p><ul>${q.map(k=>`<li>${esc(k.split('|')[0])}</li>`).join('')}</ul><button class="btn secondary small" onclick="goTraining()">Abrir formación completa</button></div>`}function goTraining(){view='training';render()}
function abandon(){if(!confirm('¿Descartar este intento? Se perderán tus respuestas de este caso.'))return;delete store.drafts[selected];save();nav('cases')}
function grade(c,d){return c.questions.map((q,i)=>{let answer=norm(d.answers[i]);let count=wordCount(d.answers[i]),criteria=c.criteria[i],hits=criteria.map(rule=>rule.split('|').some(v=>answer.includes(norm(v))));let coverage=hits.filter(Boolean).length/criteria.length;let quality=Math.min(1,count/85);let reasoning=/porque|debido|por tanto|para evitar|justific|con el fin|impacto|riesgo|prioridad|debe|permite|mediante/.test(answer)?1:0;let raw=count<8?0:coverage*.77+quality*.15+reasoning*.08;let score=Math.round((c.weights||WEIGHTS)[i]*Math.min(1,raw)*100)/100;let omissions=criteria.filter((_,j)=>!hits[j]).map(x=>x.split('|')[0]);return {score,max:(c.weights||WEIGHTS)[i],covered:criteria.filter((_,j)=>hits[j]).map(x=>x.split('|')[0]),omissions,words:count}})}
function submit(auto){let d=active();if(!d||d.submitted)return;if(!auto&&!d.answers.some(x=>x.trim())){alert('Antes de entregar escribe al menos una respuesta.');return}if(!auto&&!confirm('¿Entregar este intento ahora? No podrás modificarlo después.'))return;let c=getCase(selected),sections=grade(c,d),score=Math.round(sections.reduce((s,x)=>s+x.score,0)*100)/100;let a={id:Date.now()+'-'+Math.floor(Math.random()*10000),caseId:selected,date:new Date().toISOString(),answers:[...d.answers],sections,score,secondsUsed:d.started?5400-remaining(d):0,helpUsed:d.helpUsed,expired:!!auto};store.attempts.unshift(a);d.submitted=true;save();view='result';render()}
function resultView(){let a=store.attempts[0];if(!a)return home();let c=getCase(a.caseId);return header('Resultado del examen',`Caso ${a.caseId} · ${c.title}`,'Corrección orientativa automatizada por rúbrica de conceptos')+`<div class="split"><div><div class="card"><div class="rows"><div><div class="muted small">NOTA GLOBAL</div><div class="score">${a.score.toFixed(2)} <span style="font-size:21px;color:#8698ac">/10</span></div><span class="tag ${a.score>=5?'ok':'warn'}">${a.score>=5?'Supera el umbral orientativo':'Por debajo de 5'}</span></div><div class="muted small" style="text-align:right">${a.expired?'Tiempo agotado':'Entregado voluntariamente'}<br>${timefmt(a.secondsUsed)} consumidos<br>${a.helpUsed?'Con ayuda formativa':'Sin ayuda'}</div></div><p class="notice">La nota se calcula localmente buscando conceptos de una rúbrica y cierta extensión/justificación. <b>No comprende completamente el significado ni verifica la corrección jurídica.</b> Puede penalizar sinónimos o premiar términos usados incorrectamente. Para una valoración de tribunal, utiliza la revisión con ChatGPT y contrasta la legislación vigente.</p></div><div class="gap"></div><div class="card"><h2>Desglose y feedback</h2>${a.sections.map((r,i)=>`<div class="item"><div class="grade-row"><b>Pregunta ${i+1}</b><div class="meter"><div class="bar" style="width:${100*r.score/r.max}%"></div></div><b>${r.score.toFixed(2)} / ${r.max}</b></div><div class="muted small">Conceptos detectados: ${r.covered.length?esc(r.covered.join(', ')):'ninguno'}</div>${r.omissions.length?`<div class="small" style="color:#98591d;margin-top:7px">Por desarrollar o no detectados: ${esc(r.omissions.join(', '))}.</div>`:''}<details class="details"><summary>Ver pregunta y mi respuesta</summary><div class="body"><b>${esc(c.questions[i])}</b><p>${esc(a.answers[i]||'Sin respuesta').replace(/\n/g,'<br>')}</p></div></details></div>`).join('')}</div></div><div class="sticky"><div class="card"><h2>Corrección avanzada</h2><p class="small muted">Genera el texto listo para que ChatGPT lo evalúe de manera semántica, legal y técnica, con criterios de tribunal A1.</p><button class="btn" style="width:100%;margin-bottom:8px" onclick="copyAI()">Copiar para ChatGPT</button><button class="btn secondary" style="width:100%;margin-bottom:8px" onclick="downloadCurrent()">Exportar resultado</button><button class="btn ghost" style="width:100%" onclick="openCase(${c.id})">Repetir el caso</button></div></div></div>`}
function aiPrompt(a){let c=getCase(a.caseId),weights=c.weights||WEIGHTS;let context=c.scenario?`SITUACIÓN INICIAL:\n${c.scenario.setting}\n${c.scenario.baseline}\nINFORMACIÓN TÉCNICA:\n${c.scenario.facts.map(p=>p.join(': ')).join('\n')}\nINCIDENCIA:\n${c.scenario.trigger}\n${c.scenario.pressure}`:`ENUNCIADO: ${c.description}\nDEFICIENCIAS: ${c.issue}`;return `Actúa como tribunal exigente de oposición española de Ingeniero/a Informático/a A1. Evalúa mi supuesto ENS del RD 311/2022, sin dar por bueno el simple uso de palabras clave. Corrige EXACTITUD NORMATIVA, calidad de razonamiento, justificación técnica, riesgos, omisiones, medidas viables y estructura. Identifica errores graves. Puntúa cada una de las ${c.questions.length} preguntas sobre ${weights.join(', ')} puntos respectivamente, da nota total /10, recomendaciones personalizadas y modelo completo. Los conceptos esperados solo son referencias y no sustituyen tu valoración crítica.\n\nCASO: ${c.title}\n${context}\n\n`+c.questions.map((q,i)=>`PREGUNTA ${i+1} (${weights[i]} puntos): ${q}\nMI RESPUESTA:\n${a.answers[i]||'[Sin contestar]'}`).join('\n\n')}
async function copyAI(){let txt=aiPrompt(store.attempts[0]);try{await navigator.clipboard.writeText(txt);alert('Texto copiado. Pégalo en ChatGPT para evaluación avanzada.')}catch(e){prompt('Copia este texto y pégalo en ChatGPT:',txt)}}function downloadFile(name,contents,mime='application/json'){let b=new Blob([contents],{type:mime}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download=name;l.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function downloadCurrent(){let a=store.attempts[0];downloadFile(`ENS_Caso_${a.caseId}_resultado.json`,JSON.stringify(a,null,2))}
function trainingView(){return header('Centro de formación','Aprende antes de examinarte','Consulta conceptos y criterios de respuesta sin presión de tiempo.')+`<div class="split"><div>${EDUCATION.map((e,i)=>`<div class="card chapter"><div class="eyebrow">Bloque ${i+1}</div><h2>${esc(e.title)}</h2><p>${esc(e.text)}</p></div>`).join('')}<div class="card"><h2>Cómo preparar respuestas de nivel A1</h2><ol><li><b>Contexto y alcance:</b> qué datos, servicios y activos están afectados.</li><li><b>Normativa y riesgo:</b> qué exige el ENS y qué amenaza mitigamos.</li><li><b>Decisión técnica:</b> qué controles propones y por qué.</li><li><b>Implementación y responsables:</b> quién hace qué, prioridades y recursos.</li><li><b>Verificación:</b> evidencias, pruebas y mejora continua.</li></ol><div class="notice">La formación es una síntesis para estudiar. Para el examen utiliza también el texto consolidado del RD 311/2022, especialmente los anexos I, II y III.</div></div></div><div class="sticky"><div class="card"><h2>Normativa</h2><p class="small">Texto consolidado del ENS:</p><a target="_blank" rel="noopener" href="https://www.boe.es/buscar/act.php?id=BOE-A-2022-7191">RD 311/2022 en el BOE ↗</a><div class="gap"></div><button class="btn" onclick="nav('cases')">Practicar un caso</button></div></div></div>`}
function historyView(){return header('Seguimiento','Resultados e intentos','Tus resultados se guardan localmente en este navegador.')+`<div class="card"><div class="rows"><h2>Historial</h2><div style="display:flex;gap:8px"><button class="btn secondary small" onclick="exportAll()">Exportar todo</button><button class="btn danger small" onclick="resetAll()">Borrar historial</button></div></div>${store.attempts.length?store.attempts.map((a,i)=>`<div class="history-row"><div><b>${esc(getCase(a.caseId)?.title||'Caso')}</b><div class="muted small">${new Date(a.date).toLocaleString('es-ES')} · ${timefmt(a.secondsUsed)} · ${a.helpUsed?'Con ayuda':'Sin ayuda'}</div></div><div class="rows"><b style="color:${a.score>=5?'#197448':'#aa3448'}">${a.score.toFixed(2)}/10</b><button class="btn secondary small" onclick="inspectAttempt(${i})">Ver</button></div></div>`).join(''):'<p class="muted">Todavía no has entregado ningún examen.</p>'}</div>`}
function inspectAttempt(i){let a=store.attempts.splice(i,1)[0];store.attempts.unshift(a);save();view='result';render()}function exportAll(){downloadFile('ENS_A1_historial.json',JSON.stringify(store.attempts,null,2))}function resetAll(){if(confirm('¿Eliminar permanentemente resultados y borradores guardados en este navegador?')){store={attempts:[],drafts:{},custom:store.custom};save();render()}}
function render(){let v=document.getElementById('view');v.innerHTML=view==='home'?home():view==='cases'?casesView():view==='exam'?examView():view==='result'?resultView():view==='training'?trainingView():historyView();if(view==='exam')checkExpired()}
document.querySelectorAll('[data-view]').forEach(x=>x.addEventListener('click',()=>nav(x.dataset.view)));ticker=setInterval(()=>{if(view!=='exam')return;let d=active();if(!d||!d.started)return;if(checkExpired())return;let t=document.getElementById('timer'),p=document.getElementById('timeprogress');if(t){t.textContent=timefmt(remaining(d));t.classList.toggle('urgent',remaining(d)<=600)}if(p)p.style.width=100*(5400-remaining(d))/5400+'%'},1000);render();
</script><script src="ens-training.js"></script></body></html>
